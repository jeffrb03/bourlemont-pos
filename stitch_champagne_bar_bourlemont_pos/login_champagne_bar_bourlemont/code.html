</div>

</div>

<button class="flex-1 py-2 px-3 rounded-full text-label-md font-label-md transition-all text-on-primary bg-primary font-semibold flex items-center justify-center gap-1.5 shadow-sm" id="tab-passcode" type="button">

<span class="material-symbols-outlined text-[16px]">badge</span>

<span class="text-label-sm font-label-sm text-on-surface-variant uppercase tracking-wider">Ingrese PIN de Servicio</span>
<div class="flex gap-3 my-1">
<div class="w-3.5 h-3.5 rounded-full bg-surface-variant transition-all" id="dot-0"></div>
<div class="w-3.5 h-3.5 rounded-full bg-surface-variant transition-all" id="dot-1"></div>
<div class="w-3.5 h-3.5 rounded-full bg-surface-variant transition-all" id="dot-2"></div>
<div class="w-3.5 h-3.5 rounded-full bg-surface-variant transition-all" id="dot-3"></div>
</div>
</div>
<div class="grid grid-cols-3 gap-2 sm:gap-2.5 max-w-[280px] mx-auto w-full">
<button class="h-12 sm:h-14 rounded-2xl bg-surface-container-lowest/60 hover:bg-surface-container-high active:scale-95 transition-all text-title-lg font-title-lg text-on-surface flex items-center justify-center shadow-inner" onclick="handlePinInput('1')" type="button">1</button>
<button class="h-12 sm:h-14 rounded-2xl bg-surface-container-lowest/60 hover:bg-surface-container-high active:scale-95 transition-all text-title-lg font-title-lg text-on-surface flex items-center justify-center shadow-inner" onclick="handlePinInput('2')" type="button">2</button>
<button class="h-12 sm:h-14 rounded-2xl bg-surface-container-lowest/60 hover:bg-surface-container-high active:scale-95 transition-all text-title-lg font-title-lg text-on-surface flex items-center justify-center shadow-inner" onclick="handlePinInput('3')" type="button">3</button>
<button class="h-12 sm:h-14 rounded-2xl bg-surface-container-lowest/60 hover:bg-surface-container-high active:scale-95 transition-all text-title-lg font-title-lg text-on-surface flex items-center justify-center shadow-inner" onclick="handlePinInput('4')" type="button">4</button>
<button class="h-12 sm:h-14 rounded-2xl bg-surface-container-lowest/60 hover:bg-surface-container-high active:scale-95 transition-all text-title-lg font-title-lg text-on-surface flex items-center justify-center shadow-inner" onclick="handlePinInput('5')" type="button">5</button>
<button class="h-12 sm:h-14 rounded-2xl bg-surface-container-lowest/60 hover:bg-surface-container-high active:scale-95 transition-all text-title-lg font-title-lg text-on-surface flex items-center justify-center shadow-inner" onclick="handlePinInput('6')" type="button">6</button>
<button class="h-12 sm:h-14 rounded-2xl bg-surface-container-lowest/60 hover:bg-surface-container-high active:scale-95 transition-all text-title-lg font-title-lg text-on-surface flex items-center justify-center shadow-inner" onclick="handlePinInput('7')" type="button">7</button>
<button class="h-12 sm:h-14 rounded-2xl bg-surface-container-lowest/60 hover:bg-surface-container-high active:scale-95 transition-all text-title-lg font-title-lg text-on-surface flex items-center justify-center shadow-inner" onclick="handlePinInput('8')" type="button">8</button>
<button class="h-12 sm:h-14 rounded-2xl bg-surface-container-lowest/60 hover:bg-surface-container-high active:scale-95 transition-all text-title-lg font-title-lg text-on-surface flex items-center justify-center shadow-inner" onclick="handlePinInput('9')" type="button">9</button>
<button class="h-12 sm:h-14 rounded-2xl bg-surface-container-lowest/40 hover:bg-surface-container-high active:scale-95 transition-all text-label-md font-label-md text-on-surface-variant flex items-center justify-center" onclick="clearPin()" type="button">C</button>
<button class="h-12 sm:h-14 rounded-2xl bg-surface-container-lowest/60 hover:bg-surface-container-high active:scale-95 transition-all text-title-lg font-title-lg text-on-surface flex items-center justify-center shadow-inner" onclick="handlePinInput('0')" type="button">0</button>
<button class="h-12 sm:h-14 rounded-2xl bg-surface-container-lowest/40 hover:bg-surface-container-high active:scale-95 transition-all text-on-surface-variant flex items-center justify-center" onclick="deletePin()" type="button">
<span class="material-symbols-outlined text-[20px]">backspace</span>
</button>
</div>
</div>
<form class="hidden flex flex-col gap-4" id="section-credential">
<div class="flex flex-col gap-1.5">
<label class="text-label-sm font-label-sm text-on-surface-variant tracking-wider uppercase flex items-center gap-1.5">
<span class="material-symbols-outlined text-[15px] text-primary">person</span>
<span>Usuario / Sommelier ID</span>
</label>
<div class="relative flex items-center">
<input class="w-full bg-surface-container-lowest/70 text-on-surface text-body-md font-body-md rounded-2xl px-4 py-3.5 pl-11 focus:outline-none focus:bg-surface-container-lowest transition-all" placeholder="sommelier@bourlemont.fr" type="text" value="sommelier@bourlemont.fr"/>
<span class="material-symbols-outlined text-outline absolute left-3.5 text-[20px] pointer-events-none">wine_bar</span>
</div>
</div>
<div class="flex flex-col gap-1.5">
<label class="text-label-sm font-label-sm text-on-surface-variant tracking-wider uppercase flex items-center gap-1.5">
<span class="material-symbols-outlined text-[15px] text-primary">lock</span>
<span>Contraseña</span>
</label>
<div class="relative flex items-center">
<input class="w-full bg-surface-container-lowest/70 text-on-surface text-body-md font-body-md rounded-2xl px-4 py-3.5 pl-11 pr-11 focus:outline-none focus:bg-surface-container-lowest transition-all" id="password-input" placeholder="••••••••••••" type="password" value="CuvéeGrandCru2012"/>
<span class="material-symbols-outlined text-outline absolute left-3.5 text-[20px] pointer-events-none">key</span>
<button class="absolute right-3.5 text-outline hover:text-on-surface transition-colors p-1 flex items-center justify-center" onclick="togglePasswordVisibility()" type="button">
<span class="material-symbols-outlined text-[20px]" id="pwd-icon">visibility</span>
</button>
</div>
</div>
</form>
<button class="w-full py-4 px-6 rounded-2xl bg-gradient-to-r from-primary to-primary-fixed-dim text-on-primary font-title-md text-title-md font-semibold tracking-wide flex items-center justify-center gap-2 shadow-lg shadow-primary/25 hover:brightness-110 active:scale-[0.98] transition-all" type="button">
<span class="material-symbols-outlined text-[22px]">lock_open</span>
<span>Iniciar Sesión</span>
</button>
<div class="flex flex-col gap-3 pt-2">
<div class="flex items-center justify-between">
<label class="flex items-center gap-2.5 cursor-pointer">
<input checked="" class="w-4 h-4 rounded accent-primary bg-surface-container-lowest border-none" type="checkbox"/>
<span class="text-body-md font-body-md text-on-surface-variant select-none">Recordar terminal</span>
</label>
<div class="flex items-center gap-2">
<span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
<span class="text-label-sm font-label-sm text-on-surface-variant">Modo Noche</span>
</div>
</div>
<div class="flex items-center justify-between text-label-sm font-label-sm text-on-surface-variant pt-2">
<span class="flex items-center gap-1 text-outline">
<span class="material-symbols-outlined text-[14px]">cell_tower</span>
<span>Terminal Salon #04</span>
</span>
<button class="text-primary hover:underline transition-colors flex items-center gap-1" type="button">
<span class="material-symbols-outlined text-[14px]">support_agent</span>
<span>Soporte de Terminal</span>
</button>
</div>
</div>
</div>
</div>
</div>
<script>
  let enteredPin = '';
  const maxPinLength = 4;

  function updateDots() {
    for (let i = 0; i < maxPinLength; i++) {
      const dot = document.getElementById(`dot-${i}`);
      if (!dot) continue;
      if (i < enteredPin.length) {
        dot.className = 'w-3.5 h-3.5 rounded-full bg-primary shadow-[0_0_8px_rgba(242,202,80,0.6)] transition-all';
      } else {
        dot.className = 'w-3.5 h-3.5 rounded-full bg-surface-variant transition-all';
      }
    }
  }

  function handlePinInput(num) {
    if (enteredPin.length < maxPinLength) {
      enteredPin += num;
      updateDots();
    }
  }

  function deletePin() {
    if (enteredPin.length > 0) {
      enteredPin = enteredPin.slice(0, -1);
      updateDots();
    }
  }

  function clearPin() {
    enteredPin = '';
    updateDots();
  }

  const tabPasscode = document.getElementById('tab-passcode');
  const tabCredential = document.getElementById('tab-credential');
  const sectionPasscode = document.getElementById('section-passcode');
  const sectionCredential = document.getElementById('section-credential');

  if (tabPasscode && tabCredential && sectionPasscode && sectionCredential) {
    tabPasscode.addEventListener('click', () => {
      tabPasscode.className = 'flex-1 py-2 px-3 rounded-full text-label-md font-label-md transition-all text-on-primary bg-primary font-semibold flex items-center justify-center gap-1.5 shadow-sm';
      tabCredential.className = 'flex-1 py-2 px-3 rounded-full text-label-md font-label-md transition-all text-on-surface-variant hover:text-on-surface flex items-center justify-center gap-1.5';
      sectionPasscode.classList.remove('hidden');
      sectionCredential.classList.add('hidden');
    });

    tabCredential.addEventListener('click', () => {
      tabCredential.className = 'flex-1 py-2 px-3 rounded-full text-label-md font-label-md transition-all text-on-primary bg-primary font-semibold flex items-center justify-center gap-1.5 shadow-sm';
      tabPasscode.className = 'flex-1 py-2 px-3 rounded-full text-label-md font-label-md transition-all text-on-surface-variant hover:text-on-surface flex items-center justify-center gap-1.5';
      sectionCredential.classList.remove('hidden');
      sectionPasscode.classList.add('hidden');
    });
  }

  function togglePasswordVisibility() {
    const pwdInput = document.getElementById('password-input');
    const pwdIcon = document.getElementById('pwd-icon');
    if (!pwdInput || !pwdIcon) return;
    if (pwdInput.type === 'password') {
      pwdInput.type = 'text';
      pwdIcon.textContent = 'visibility_off';
    } else {
      pwdInput.type = 'password';
      pwdIcon.textContent = 'visibility';
    }
  }
</script></main></body></html>
